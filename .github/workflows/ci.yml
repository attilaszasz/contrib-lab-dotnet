name: CI

# Run on every pull request that targets main, and on every push to main.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# CI only reads the repository. It never deploys anything.
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: ContribLab.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build the solution in Release configuration
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run the automated tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build
