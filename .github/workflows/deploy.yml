name: Deploy to Azure App Service

# Deployment only happens for accepted code: pushes to main or a manual run.
# Pull requests never deploy, because they use the CI workflow instead.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: ContribLab.slnx
  WEB_PROJECT: src/ContribLab.Web/ContribLab.Web.csproj
  AZURE_WEBAPP_PACKAGE_PATH: ./publish

jobs:
  build-test-deploy:
    name: Build, test and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build the solution in Release configuration
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run the automated tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build

      - name: Publish the web application
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # The Azure steps are skipped until the AZURE_WEBAPP_NAME repository
      # variable and the Azure authentication secrets have been configured.
      - name: Sign in to Azure with OpenID Connect
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the published app to Azure App Service
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Simple smoke check: confirm that the Home page responds.
      # Other pages are intentionally buggy, so they are not checked.
      - name: Smoke check the deployed Home page
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || true)
            echo "Attempt $attempt returned HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Home page is responding."
              exit 0
            fi
            sleep 15
          done
          echo "The Home page did not respond with HTTP 200 after several attempts."
          exit 1
